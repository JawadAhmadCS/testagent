<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bella Cucina — Chat with Us</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6EF;
    --warm-white: #FDF9F4;
    --charcoal: #1C1C1A;
    --olive: #5C6B3A;
    --olive-light: #7A8F50;
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --rust: #B5522B;
    --muted: #8A8680;
    --border: #E8E0D0;
    --shadow: rgba(28,28,26,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(92,107,58,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 60% 40%, rgba(181,82,43,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Decorative fork/knife motifs */
  body::after {
    content: '✦';
    position: fixed;
    top: 8%;
    right: 8%;
    font-size: 60px;
    color: rgba(201,168,76,0.15);
    pointer-events: none;
    z-index: 0;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* Header */
  .restaurant-header {
    text-align: center;
    padding: 28px 20px 20px;
    background: var(--charcoal);
    border-radius: 24px 24px 0 0;
    position: relative;
    overflow: hidden;
  }

  .restaurant-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.15) 0%, transparent 50%, rgba(92,107,58,0.10) 100%);
  }

  .header-ornament {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    margin-bottom: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .header-ornament::before, .header-ornament::after {
    content: '';
    width: 30px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .restaurant-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 300;
    color: var(--cream);
    letter-spacing: 2px;
    line-height: 1;
    position: relative;
    margin-bottom: 4px;
  }

  .restaurant-name em {
    color: var(--gold-light);
    font-style: italic;
  }

  .restaurant-subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(250,246,239,0.45);
    font-weight: 300;
    position: relative;
    margin-bottom: 14px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(92,107,58,0.3);
    border: 1px solid rgba(122,143,80,0.4);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    color: #a8c274;
    letter-spacing: 1px;
    position: relative;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7dc44e;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  /* Chat area */
  .chat-container {
    background: var(--warm-white);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 440px;
  }

  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    gap: 10px;
    animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }

  .avatar.bot {
    background: var(--charcoal);
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 600;
  }

  .avatar.user-av {
    background: var(--olive);
    color: white;
    font-size: 12px;
  }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--charcoal);
  }

  .message.bot .bubble {
    background: white;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .message.user .bubble {
    background: var(--charcoal);
    color: var(--cream);
    border-bottom-right-radius: 4px;
  }

  /* Quick replies */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
    padding: 0 16px 14px 56px;
  }

  .quick-reply {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    color: var(--olive);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .quick-reply:hover {
    background: var(--olive);
    color: white;
    border-color: var(--olive);
    transform: translateY(-1px);
  }

  /* Typing indicator */
  .typing-indicator {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    margin-bottom: 4px;
  }

  .typing-indicator.visible { display: flex; }

  .typing-dots {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 4px;
    align-items: center;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    background: white;
    border: 1px solid var(--border);
    border-top: 1px solid var(--border);
    border-radius: 0 0 24px 24px;
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    box-shadow: 0 4px 20px var(--shadow);
  }

  .input-field {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: var(--charcoal);
    background: var(--cream);
    outline: none;
    resize: none;
    max-height: 80px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  .input-field:focus { border-color: var(--gold); }
  .input-field::placeholder { color: var(--muted); }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--charcoal);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--olive); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { width: 16px; height: 16px; fill: var(--gold); }

  /* Footer */
  .chat-footer {
    text-align: center;
    padding: 10px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* Divider */
  .time-divider {
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .time-divider::before, .time-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
</style>
</head>
<body>

<div class="page-wrapper">

  <div class="restaurant-header">
    <div class="header-ornament">Est. 1987</div>
    <div class="restaurant-name"><em>Bella</em> Cucina</div>
    <div class="restaurant-subtitle">Authentic Italian · Downtown</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Open now · Closes 10 PM
    </div>
  </div>

  <div class="chat-container">
    <div class="messages-area" id="messages">
      <div class="time-divider">Today</div>
    </div>

    <div class="typing-indicator" id="typing">
      <div class="avatar bot">B</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div id="quick-replies-container" class="quick-replies"></div>

  <div class="input-area">
    <textarea 
      class="input-field" 
      id="userInput" 
      placeholder="Ask about our menu, hours, reservations…" 
      rows="1"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="chat-footer">Powered by AI · Bella Cucina © 2026</div>

</div>

<script>
const RESTAURANT_SYSTEM = `You are Sofia, a warm and knowledgeable virtual host for Bella Cucina, an authentic Italian restaurant in downtown.

RESTAURANT INFO:
- Name: Bella Cucina
- Cuisine: Authentic Italian, family recipes since 1987
- Address: 42 Olive Street, Downtown
- Hours: Mon–Thu 11am–10pm, Fri–Sat 11am–11pm, Sun 12pm–9pm
- Phone: (555) 842-1987
- Reservations: Required for parties of 6+, recommended on weekends

MENU HIGHLIGHTS:
Starters: Bruschetta al Pomodoro ($9), Burrata con Prosciutto ($16), Zuppa di Cipolle ($11), Calamari Fritti ($14)
Pasta: Tagliatelle al Ragù Bolognese ($22), Cacio e Pepe ($19), Pappardelle al Cinghiale ($26), Spaghetti alle Vongole ($24), Rigatoni all'Amatriciana ($20), Gnocchi al Pesto ($18)
Mains: Osso Buco ($38), Branzino al Forno ($34), Pollo alla Cacciatora ($28), Bistecca Fiorentina ($52 per person, min 2)
Desserts: Tiramisu ($9), Panna Cotta ($8), Cannoli Siciliani ($7), Gelato ($6)
Wine: Extensive Italian wine list, ask for our sommelier's pairing
Dietary: Gluten-free pasta available (+$3), several vegan options, please inform server of allergies

SPECIAL INFO:
- Happy Hour: Mon–Fri 4–6pm, $5 off wines by the glass
- Private dining room available for parties up to 20
- Parking: Free valet on weekends
- Dress code: Smart casual

PERSONALITY: You're Sofia — warm, charming, knowledgeable about Italian food and culture. You speak with subtle warmth and occasional Italian phrases (never overdo it). Keep responses concise (2-4 sentences usually). Always end with a helpful offer or question to keep the conversation going. If someone wants to make a reservation, collect: date, time, party size, name, phone number.`;

let conversationHistory = [];
let quickRepliesShown = false;

const initialQuickReplies = [
  "📋 See the menu",
  "📅 Make a reservation", 
  "⏰ Hours & location",
  "🍷 Tonight's specials"
];

function addMessage(text, sender) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  
  const avatarDiv = document.createElement('div');
  avatarDiv.className = `avatar ${sender === 'bot' ? 'bot' : 'user-av'}`;
  avatarDiv.textContent = sender === 'bot' ? 'B' : '✦';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = text.replace(/\n/g, '<br>');
  
  div.appendChild(avatarDiv);
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function showQuickReplies(replies) {
  const container = document.getElementById('quick-replies-container');
  container.innerHTML = '';
  replies.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = r;
    btn.onclick = () => {
      container.innerHTML = '';
      document.getElementById('userInput').value = r.replace(/^[^\s]+ /, '');
      sendMessage();
    };
    container.appendChild(btn);
  });
}

function setTyping(visible) {
  document.getElementById('typing').classList.toggle('visible', visible);
  const messages = document.getElementById('messages');
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  document.getElementById('quick-replies-container').innerHTML = '';
  input.value = '';
  input.style.height = 'auto';
  
  addMessage(text, 'user');
  conversationHistory.push({ role: 'user', content: text });

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  setTyping(true);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: RESTAURANT_SYSTEM,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || "I'm sorry, I had a little trouble there. Could you ask me again?";

    setTyping(false);
    addMessage(reply, 'bot');
    conversationHistory.push({ role: 'assistant', content: reply });

    // Suggest contextual quick replies
    const lowerReply = reply.toLowerCase();
    const lowerText = text.toLowerCase();
    
    if (lowerText.includes('menu') || lowerText.includes('food') || lowerText.includes('eat')) {
      showQuickReplies(['Pasta dishes', 'Vegetarian options', 'What\'s popular?', 'Desserts']);
    } else if (lowerText.includes('reserv') || lowerText.includes('book') || lowerText.includes('table')) {
      showQuickReplies(['Party of 2', 'Party of 4', 'Large group (6+)', 'Private dining']);
    } else if (lowerText.includes('hours') || lowerText.includes('open') || lowerText.includes('location')) {
      showQuickReplies(['Make a reservation', 'See the menu', 'Parking info']);
    } else if (!quickRepliesShown) {
      showQuickReplies(['📋 Full menu', '📅 Book a table', '🍷 Wine list', '❓ Ask anything']);
    }
    quickRepliesShown = true;

  } catch (err) {
    setTyping(false);
    addMessage("Apologies, our chat is having a moment. Please call us at (555) 842-1987 or try again shortly!", 'bot');
  }

  btn.disabled = false;
  input.focus();
}

// Auto-resize textarea
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});

// Enter to send
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Initial greeting
window.addEventListener('load', async () => {
  await new Promise(r => setTimeout(r, 600));
  setTyping(true);
  await new Promise(r => setTimeout(r, 1200));
  setTyping(false);
  
  const greeting = "Benvenuti! 👋 I'm Sofia, your virtual host at Bella Cucina. Whether you'd like to explore our menu, make a reservation, or ask about tonight's specials — I'm here to help. What can I do for you?";
  addMessage(greeting, 'bot');
  conversationHistory.push({ role: 'assistant', content: greeting });
  showQuickReplies(initialQuickReplies);
});
</script>
</body>
</html>
